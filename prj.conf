# Logging configurations
CONFIG_LOG=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# The status panel prints directly, not through the log queue
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BACKEND_SHOW_TIMESTAMP=n

# Servo outputs
CONFIG_PWM=y

# Joystick axes and push switch
CONFIG_ADC=y
CONFIG_GPIO=y

# DK Buttons and LEDs library
CONFIG_DK_LIBRARY=y
